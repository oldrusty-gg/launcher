[package]
name = "roses-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native Windows launcher for importing and browsing a local Roses library"

[dependencies]
serde.workspace = true
serde_json.workspace = true
png.workspace = true
# No game crate: every game is described by its manifest and reached through
# its own programs (platform-sdk repository).
# The game manifest and launcher-game contract.
platform-sdk = { path = "../../../platform-sdk/crates/platform-sdk" }
# The Profile page: the account protocol over TLS.
platform-net = { path = "../../../platform-sdk/crates/platform-net" }
# ROSES_LAUNCHER_RECORD (videos; a tool): the MP4 writer.
platform-video = { path = "../../../platform-sdk/crates/platform-video" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging"] }
